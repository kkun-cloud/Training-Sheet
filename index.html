<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b111e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRAINING.LOG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<title>TRAINING.LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b111e; --bg-card:#141c2c; --bg-elev:#1d2940; --line:#27344c;
  --text:#e9eef7; --text-dim:#93a0b5; --text-faint:#5b6a82;
  --accent:#4f8df9; --accent-dim:#1d3a66;
  --gold:#f0b429; --green:#2fbf71; --yellow:#e7b416; --red:#ef5561;
  --serif:'Noto Sans JP',sans-serif; --sans:'Noto Sans JP',sans-serif; --mono:'JetBrains Mono',monospace;
}
/* touch-action:manipulation = ダブルタップズームだけを無効化（ピンチズームは残す） */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom));}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
button > *{pointer-events:none;}
button svg, button span, button em, button b, button i{pointer-events:none;}
/* iOSは font-size < 16px の入力欄にフォーカスすると自動ズームするため 16px を下限にする */
input,select,textarea{font-family:var(--mono);font-size:16px;color:var(--text);background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0;}
.app-head{display:flex;align-items:baseline;justify-content:space-between;padding:8px 4px 16px;}
.app-head h1{font-weight:900;font-size:20px;letter-spacing:2px;}
.app-head h1 span{color:var(--accent);}
.head-date{font-family:var(--mono);font-size:11px;color:var(--text-faint);letter-spacing:1px;}
.view{display:none;}
.view.active{display:block;}
.panel{background:var(--bg-card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;}
.panel-title{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;}
.panel-title small{font-size:9px;color:var(--text-faint);letter-spacing:1px;}
.sep{border:none;border-top:1px solid var(--line);margin:10px 0;}

/* ===== banners ===== */
.bk-banner{background:rgba(231,180,22,0.09);border:1px solid rgba(231,180,22,0.5);border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--yellow);}
.rc-banner{background:rgba(47,191,113,0.10);border:1px solid rgba(47,191,113,0.55);border-radius:14px;padding:12px 14px;margin:0 0 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--green);line-height:1.5;}
.rc-banner.warn{background:rgba(239,85,97,0.10);border-color:rgba(239,85,97,0.55);color:var(--red);}
.rc-banner span{flex:1;}
.rc-banner button{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:10px;background:currentColor;font-weight:800;font-size:12px;}
.rc-banner button b{color:var(--bg);}
.bk-banner button{background:var(--yellow);color:#171408;font-weight:700;font-size:12px;padding:8px 14px;border-radius:99px;flex-shrink:0;min-height:38px;}
.ovr-banner{background:rgba(79,141,249,0.08);border:1px solid var(--accent-dim);border-radius:14px;padding:9px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--accent);}
.ovr-banner b{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-right:6px;}
.ovr-banner button{border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:7px 14px;border-radius:99px;min-height:34px;}

/* ===== weekly gauge ===== */
.wg-item{margin-bottom:4px;}
.wg-item:last-child{margin-bottom:0;}
.wg-row{width:100%;display:flex;align-items:center;gap:10px;padding:4px 0;min-height:30px;text-align:left;}
.wg-name{width:38px;font-size:12px;font-weight:500;color:var(--text-dim);}
.wg-bar{flex:1;height:8px;background:var(--bg-elev);border-radius:99px;overflow:hidden;position:relative;display:block;}
.wg-min{position:absolute;top:0;bottom:0;width:2px;background:rgba(233,238,247,0.3);z-index:2;}
.wg-fill{position:absolute;left:0;top:0;height:100%;border-radius:99px;transition:width .3s;display:block;}
.wg-fill.low{background:var(--red);}
.wg-fill.ok{background:var(--green);}
.wg-fill.over{background:var(--yellow);}
.wg-num{width:72px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.wg-num b{color:var(--text);font-weight:700;}
.wg-bd{padding:2px 0 8px 48px;}
.wg-bd-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-dim);font-family:var(--mono);padding:2px 0;}

/* ===== date & day tabs ===== */
.date-row{display:flex;gap:8px;margin-bottom:10px;}
.date-row input[type=date]{flex:1;min-height:46px;padding:0 14px;color-scheme:dark;}
.day-pill{min-width:54px;min-height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;color:var(--accent);}
.day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
.day-tab{position:relative;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg-elev);color:var(--text-dim);font-weight:700;font-size:14px;}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.day-tab .cur-dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--gold);}

/* ===== exercise card ===== */
.ex-card{background:var(--bg-card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;}
.exc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.exc-name{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35;}
.exc-role{font-size:11px;color:var(--text-faint);text-align:right;flex-shrink:0;line-height:1.5;}
.tagchip{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 8px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font-weight:700;}
.tagchip.t37{border-color:var(--accent);color:var(--accent);}
.mus-dots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.mus-dot{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-dim);}
.mus-dot i{width:7px;height:7px;border-radius:50%;display:block;}
.last-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:var(--bg-elev);border-radius:14px;padding:9px 12px;margin-bottom:10px;}
.last-info{font-family:var(--mono);font-size:11px;color:var(--text-dim);line-height:1.7;min-width:0;}
.last-info .lr-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--text-faint);font-size:10px;}
.proto-tag{font-family:var(--mono);font-size:9px;letter-spacing:0.5px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--text-dim);}
.copy-btn{flex-shrink:0;border:1px solid var(--line);border-radius:99px;color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:0 14px;min-height:44px;display:flex;align-items:center;gap:4px;background:var(--bg-card);}
.copy-btn.copied{border-color:var(--green);color:var(--green);}

/* set rows (big-number style) */
.set-row{width:100%;display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:14px;margin-bottom:6px;background:var(--bg-elev);border:1px solid transparent;text-align:left;min-height:64px;}
.set-row.filled{background:rgba(47,191,113,0.08);border-color:rgba(47,191,113,0.25);}
.set-row:active{border-color:var(--accent);}
.sr-idx{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--bg-card);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.sr-idx.sub{font-family:var(--mono);font-size:9px;letter-spacing:0;}
.best-badge{flex-shrink:0;background:var(--gold);color:#1d1607;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;}
.sr-vals{flex:1;display:flex;align-items:baseline;justify-content:space-around;gap:4px;min-width:0;}
.sr-val{display:flex;flex-direction:column;align-items:center;min-width:0;}
.sr-val b{font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.1;color:var(--text);white-space:nowrap;}
.sr-val b.empty{color:var(--text-faint);font-weight:400;}
.sr-val i{font-style:normal;font-size:9.5px;color:var(--text-faint);margin-top:2px;letter-spacing:0.5px;}
.sr-check{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;transition:all .15s;}
.sr-check.on{background:var(--green);border-color:var(--green);color:#fff;}

.cond-row{display:flex;align-items:center;gap:6px;margin:10px 0;flex-wrap:wrap;}
.cond-lab{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--text-faint);}
.cond-pill{border:1px solid var(--line);border-radius:99px;padding:0 13px;min-height:40px;font-size:12px;color:var(--text-dim);background:var(--bg-elev);}
.cond-pill.active{border-color:var(--accent);color:#fff;background:var(--accent-dim);}
.memo-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.memo-row label{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-faint);}
.memo-row input{flex:1;min-height:42px;padding:0 12px;font-family:var(--sans);font-size:16px;text-align:left;}
.calc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--bg-elev);border-radius:12px;padding:8px 12px;margin-bottom:10px;min-height:36px;flex-wrap:wrap;}
.calc-row .c1rm{color:var(--text);}
.timer-row{display:flex;gap:6px;flex-wrap:wrap;}
.timer-btn{border:1px solid var(--line);border-radius:99px;background:var(--bg-elev);color:var(--text-dim);font-family:var(--mono);font-size:11px;letter-spacing:0.5px;padding:0 14px;min-height:42px;display:flex;align-items:center;gap:5px;}
.timer-btn.t37{border-color:var(--accent-dim);color:var(--accent);}
.off-msg{text-align:center;padding:44px 0;color:var(--text-faint);}
.off-msg .off-big{font-weight:900;font-size:26px;letter-spacing:8px;color:var(--text-dim);margin-bottom:6px;}

/* ===== indicators ===== */
.ind{font-family:var(--mono);font-size:9px;letter-spacing:0.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.ind-pr-w{background:rgba(240,180,41,0.15);border:1px solid var(--gold);color:var(--gold);}
.ind-pr-r{background:rgba(239,85,97,0.12);border:1px solid var(--red);color:var(--red);}
.ind-pr{background:rgba(240,180,41,0.08);border:1px solid var(--gold);color:var(--gold);}
.ind-warn{background:rgba(239,85,97,0.12);border:1px solid var(--red);color:var(--red);}
.ind-flat{background:rgba(231,180,22,0.1);border:1px solid var(--yellow);color:var(--yellow);}
.ind-up{background:rgba(47,191,113,0.12);border:1px solid var(--green);color:var(--green);}
.ind-init{background:var(--bg-elev);border:1px solid var(--line);color:var(--text-dim);}

/* ===== floating ===== */
.save-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:150;background:var(--accent);color:#fff;font-weight:800;font-size:14px;letter-spacing:2px;padding:15px 40px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,0.55);min-height:50px;}
.save-fab:active{background:#3a72d4;}
.timer-chip{position:fixed;left:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:160;background:var(--bg-elev);border:1px solid var(--gold);border-radius:99px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--gold);box-shadow:0 6px 18px rgba(0,0,0,0.5);min-height:44px;}
.timer-chip i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(160px + env(safe-area-inset-bottom));z-index:400;background:var(--bg-elev);border:1px solid var(--accent);color:var(--text);font-size:13px;padding:10px 22px;border-radius:99px;opacity:0;transition:all .25s;pointer-events:none;max-width:90%;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== floating pill tabbar ===== */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:200;background:rgba(22,30,46,0.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;display:flex;gap:2px;padding:6px;width:min(420px,calc(100% - 24px));box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--text-faint);font-family:var(--mono);font-size:8.5px;letter-spacing:1px;min-height:54px;border-radius:99px;transition:all .15s;}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab-btn.active{color:#fff;background:var(--accent);}

/* ===== bottom sheet ===== */
.sheet-back{position:fixed;inset:0;z-index:350;background:rgba(4,8,16,0.6);display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--bg-card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:slideup .22s ease-out;}
@keyframes slideup{from{transform:translateY(40%);}to{transform:translateY(0);}}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 14px;}
.sheet h3{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px;letter-spacing:0.5px;}
.sheet-sub{text-align:center;font-size:11px;color:var(--text-faint);margin:-10px 0 14px;}

/* stepper rows in sheet */
.st-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.st-btn{flex-shrink:0;width:64px;min-height:60px;border-radius:16px;background:var(--bg-elev);border:1px solid var(--line);color:var(--text);font-size:26px;font-weight:400;}
.st-btn:active{border-color:var(--accent);color:var(--accent);}
.st-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;}
.st-mid input{width:100%;background:none;border:none;text-align:center;font-family:var(--mono);font-weight:800;font-size:40px;color:var(--text);padding:0;min-height:48px;border-radius:0;}
.st-mid input:focus{border:none;}
.st-mid label{font-size:11px;color:var(--text-faint);letter-spacing:1px;}
.st-hint{text-align:center;font-size:12px;color:var(--text-dim);margin:-6px 0 14px;}
.st-done-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.st-done-btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg-elev);color:var(--text-dim);font-size:16px;font-weight:700;}
.st-done-btn.sel-yes{border-color:var(--green);color:var(--green);background:rgba(47,191,113,0.1);}
.st-done-btn.sel-no{border-color:var(--red);color:var(--red);background:rgba(239,85,97,0.1);}
.st-done-btn.sel-none{border-color:var(--text-dim);color:var(--text);}
.sheet-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sheet-foot button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg-elev);color:var(--text-dim);font-size:13px;font-weight:600;}
.sheet-primary{width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;letter-spacing:1px;}
.sheet-primary:active{background:#3a72d4;}

/* ring timer */
.ring-wrap{position:relative;width:230px;height:230px;margin:6px auto 14px;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg-elev);stroke-width:12;}
.ring-arc{fill:none;stroke:var(--gold);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear;}
.ring-wrap.warn .ring-arc{stroke:var(--red);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.ring-time{font-family:var(--mono);font-weight:800;font-size:46px;line-height:1;}
.ring-round{font-family:var(--mono);font-size:11px;color:var(--text-faint);letter-spacing:1px;}
.timer-ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.timer-ctl button{min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bg-elev);color:var(--text);font-family:var(--mono);font-size:14px;font-weight:700;}
.timer-ctl button.skip{color:var(--red);border-color:rgba(239,85,97,0.4);}

/* ===== history ===== */
.hsel{width:100%;min-height:50px;padding:0 14px;font-size:14px;margin-bottom:10px;appearance:none;}
.pill-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.pill-scroll::-webkit-scrollbar{display:none;}
.proto-pill{flex-shrink:0;border:1px solid var(--line);border-radius:99px;background:var(--bg-card);color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:0 15px;min-height:40px;}
.proto-pill.active{border-color:var(--accent);color:#fff;background:var(--accent-dim);}
.metric-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px;}
.metric-btn{min-height:42px;border:1px solid var(--line);border-radius:99px;background:var(--bg-card);color:var(--text-dim);font-family:var(--mono);font-size:10px;letter-spacing:1px;}
.metric-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-tile{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;}
.stat-tile .sv{font-family:var(--mono);font-weight:700;font-size:19px;}
.stat-tile .sv small{font-size:10px;color:var(--text-faint);font-weight:400;}
.stat-tile .sl{font-family:var(--mono);font-size:8.5px;letter-spacing:1.5px;color:var(--text-faint);margin-top:3px;}
.stat-tile .sv.gold{color:var(--gold);}
.chart-box{background:var(--bg-card);border:1px solid var(--line);border-radius:18px;padding:12px 8px;margin-bottom:14px;height:230px;position:relative;}
.chart-box canvas{width:100%!important;height:100%!important;}
.log-entry{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
.log-entry:last-child{border-bottom:none;}
.le-date{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:74px;flex-shrink:0;padding-top:2px;}
.le-main{flex:1;min-width:0;}
.le-vals{font-family:var(--mono);font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.le-memo{font-size:11px;color:var(--text-faint);margin-top:2px;}
.empty-msg{text-align:center;color:var(--text-faint);padding:30px 0;font-size:12px;}

/* ===== stats ===== */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.period-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px;}
.period-btn{min-height:40px;border-radius:99px;border:1px solid var(--line);background:var(--bg-elev);color:var(--text-dim);font-size:12px;font-weight:600;}
.period-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.hbar-row{margin-bottom:10px;}
.hbar-row:last-child{margin-bottom:0;}
.hbar-label{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
.hbar-label b{color:var(--text);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar-label span{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.hbar-track{height:9px;background:var(--bg-elev);border-radius:99px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:99px;transition:width .3s;}
.grp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.grp-row:last-child{border-bottom:none;}
.grp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.grp-name{width:44px;font-size:13px;font-weight:600;}
.grp-bar{flex:1;height:8px;background:var(--bg-elev);border-radius:99px;overflow:hidden;}
.grp-bar i{display:block;height:100%;border-radius:99px;}
.grp-val{text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);flex-shrink:0;line-height:1.4;}
.grp-val b{display:block;color:var(--text);font-size:12px;}
.pr-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;min-height:48px;}
.pr-item:last-child{border-bottom:none;}
.pr-item .pd{font-family:var(--mono);font-size:10px;color:var(--text-faint);width:70px;flex-shrink:0;}
.pr-item .pn{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr-item .pv{font-family:var(--mono);font-size:12px;color:var(--gold);}
.stag-toggle{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px;}
.stag-card{width:100%;text-align:left;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;}
.stag-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.stag-name{font-weight:700;font-size:13px;}
.stag-lv{font-family:var(--mono);font-size:9px;letter-spacing:1px;font-weight:700;padding:2px 9px;border-radius:99px;}
.lv-bad{background:rgba(239,85,97,0.15);color:var(--red);border:1px solid var(--red);}
.lv-mid{background:rgba(231,180,22,0.12);color:var(--yellow);border:1px solid var(--yellow);}
.lv-lite{background:rgba(240,180,41,0.1);color:var(--gold);border:1px solid var(--gold);}
.lv-ok{background:rgba(47,191,113,0.12);color:var(--green);border:1px solid var(--green);}
.stag-meta{font-family:var(--mono);font-size:10px;color:var(--text-faint);display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.stag-dots{display:inline-flex;gap:4px;align-items:center;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
.sdot.d-pr{background:var(--gold);}
.sdot.d-up{background:var(--green);}
.sdot.d-flat{background:var(--yellow);}
.sdot.d-warn{background:var(--red);}
.stag-act{font-size:11.5px;color:var(--text-dim);}

/* ===== 1RM calc ===== */
.rm-result{text-align:center;margin-bottom:16px;}
.rm-result .rm-big{font-family:var(--mono);font-weight:800;font-size:44px;color:var(--gold);line-height:1.1;}
.rm-result .rm-lbl{font-size:11px;color:var(--text-faint);letter-spacing:1px;}
.rm-step-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px;}
.rm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.rm-cell{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;}
.rm-cell .rp{font-size:10px;color:var(--text-faint);font-family:var(--mono);}
.rm-cell .rw{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:2px;}

/* ===== settings ===== */
.set-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg-elev);color:var(--text);font-size:13px;margin-bottom:8px;text-align:left;}
.set-btn small{color:var(--text-faint);font-size:11px;}
.set-btn.danger{border-color:rgba(239,85,97,0.4);color:var(--red);}
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;}
.tgl{position:relative;width:52px;height:30px;border-radius:99px;background:var(--bg-elev);border:1px solid var(--line);transition:background .2s;flex-shrink:0;}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text-dim);transition:all .2s;}
.tgl.on{background:var(--green);border-color:var(--green);}
.tgl.on::after{left:25px;background:#fff;}
.set-note{font-size:11px;color:var(--text-faint);margin-top:6px;line-height:1.6;}
.legend-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-dim);}
.legend-row:last-child{border-bottom:none;}
.proto-desc{font-size:12px;color:var(--text-dim);line-height:1.8;}
.proto-desc b{color:var(--text);}
.proto-desc ul{list-style:none;margin-top:6px;}
.proto-desc li{padding-left:14px;position:relative;margin-bottom:4px;}
.proto-desc li::before{content:'·';position:absolute;left:2px;color:var(--accent);}

/* ===== modal (program editors) ===== */
.modal-back{position:fixed;inset:0;z-index:300;background:rgba(4,8,16,0.65);display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s;}
.modal{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--bg-card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:slideup .22s ease-out;}
.modal h3{font-size:16px;font-weight:800;margin-bottom:14px;letter-spacing:0.5px;}
.m-field{margin-bottom:12px;}
.m-field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--text-faint);margin-bottom:5px;}
.m-field input,.m-field select{width:100%;min-height:46px;padding:0 14px;font-size:16px;}
.m-field input:disabled{opacity:0.45;}
.m-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.mus-chip{border:1px solid var(--line);border-radius:99px;min-height:40px;padding:0 15px;font-size:12px;color:var(--text-dim);background:var(--bg-elev);}
.mus-chip.active{border-color:var(--accent);color:#fff;background:var(--accent-dim);}
.chk-row{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;color:var(--text-dim);}
.chk-box{width:24px;height:24px;border:1px solid var(--line);border-radius:8px;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--green);flex-shrink:0;}
.chk-row.on .chk-box{border-color:var(--green);}
.chk-row.on{color:var(--text);}
.m-btns{display:flex;gap:8px;margin-top:16px;}
.m-btn{flex:1;min-height:50px;border-radius:14px;font-size:14px;font-weight:700;border:1px solid var(--line);color:var(--text-dim);}
.m-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.err-msg{color:var(--red);font-size:11px;margin-top:4px;min-height:14px;}
.pe-daytabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
.pe-daytab{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg-elev);color:var(--text-dim);font-weight:700;}
.pe-daytab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.pe-item{display:flex;align-items:center;gap:6px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:6px;}
.pe-item .pe-name{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pe-item .pe-name small{display:block;color:var(--text-faint);font-size:10px;font-family:var(--mono);}
.pe-ib{width:40px;min-height:40px;border:1px solid var(--line);border-radius:12px;color:var(--text-dim);font-size:13px;flex-shrink:0;}
.pe-ib.del{color:var(--red);}
.add-btn{width:100%;min-height:46px;border:1px dashed var(--line);border-radius:14px;color:var(--accent);font-size:13px;margin-top:4px;}
.tgt-grid{display:grid;grid-template-columns:40px 1fr 16px 1fr;gap:8px;align-items:center;margin-bottom:8px;}
.tgt-grid span{font-size:13px;color:var(--text-dim);}
.tgt-grid input{min-height:46px;text-align:center;}
textarea.imp-ta{width:100%;min-height:120px;padding:10px;font-size:12px;resize:vertical;}
</style>
</head>

<script>
'use strict';
/* ================= CONSTANTS ================= */
const LS_KEY='training_log_v1', LS_PREFS='training_log_prefs_v1', LS_DRAFT='training_log_draft_v1';
const DAYS=['日','月','火','水','木','金','土'];

const CONDS=['良好','普通','疲労気味','不調'];

const EX_GROUP_FALLBACK={
  'bench':'胸','incline':'胸','cable_cross':'胸','pec_fly':'胸','dips':'胸',
  'pullup':'背中','tbar_row':'背中','one_pulldown':'背中','lat_t':'背中','seated_row':'背中','front_pulldown':'背中',
  'shoulder_p':'肩','cable_lat':'肩','cable_lat_b':'肩','face_pull':'肩','face_pull_b':'肩',
  'hack':'脚','rdl':'脚',
  'bb_curl_a':'腕','bb_curl_b':'腕','incline_curl':'腕','narrow':'腕',
  'ez_lying':'腕','ez_ext':'腕',
  'hlr':null
};
const EX_NAME_FALLBACK={
  bench:'ベンチプレス',incline:'インクラインベンチ',cable_cross:'ケーブルクロス',pec_fly:'ペックフライ',dips:'ディップス（加重）',
  pullup:'懸垂（加重）',tbar_row:'Tバーロー',one_pulldown:'ワンハンドプルダウン',lat_t:'ラットプルTバー',seated_row:'シーテッドロー',front_pulldown:'フロントプルダウン',
  shoulder_p:'ショルダープレス',cable_lat:'ケーブルサイドレイズ',cable_lat_b:'ケーブルサイドレイズB',face_pull:'フェイスプル',face_pull_b:'フェイスプルB',
  hack:'ハックスクワット',rdl:'RDL',
  bb_curl_a:'バーベルカール',bb_curl_b:'バーベルカール（3/7）',incline_curl:'インクラインカール',narrow:'ナローベンチ',
  ez_lying:'EZライイング',ez_ext:'EZライイングエクステンション',hlr:'ハンギングレッグレイズ'
};
const DEFAULT_WEEKLY_TARGETS={'胸':{min:10,max:15},'背中':{min:12,max:16},'肩':{min:12,max:16},'脚':{min:8,max:12},'腕':{min:8,max:12}};

const HLR_ITEM={id:'hlr',name:'ハンギングレッグレイズ',role:'コア',rpe:null,spec:'2×13',muscles:['コア'],bo:false,f37:false};
const DEFAULT_PROGRAM={
  '月':{title:'オフ',sub:'休養日',items:[]},
  '火':{title:'胸補助＋背中補助',sub:'軽め45分想定',items:[
    {id:'pec_fly',name:'ペックフライ',role:'胸補助',rpe:7,spec:'3×12',muscles:['胸'],bo:false,f37:false},
    {id:'dips',name:'ディップス（加重）',role:'胸＋三頭',rpe:7,spec:'3×10',muscles:['胸','三頭'],bo:false,f37:false},
    {id:'lat_t',name:'ラットプルTバー',role:'背中補助',rpe:6,spec:'3×12',muscles:['背中'],bo:false,f37:false},
    {id:'seated_row',name:'シーテッドロー',role:'背中補助',rpe:6,spec:'3×12',muscles:['背中'],bo:false,f37:false},
    Object.assign({},HLR_ITEM)
  ]},
  '水':{title:'オフ',sub:'休養日',items:[]},
  '木':{title:'脚＋肩',sub:'',items:[
    {id:'hack',name:'ハックスクワット',role:'脚メイン',rpe:8,spec:'3×10',muscles:['脚'],bo:false,f37:false},
    {id:'rdl',name:'RDL',role:'ハム',rpe:7,spec:'3×10',muscles:['脚'],bo:false,f37:false},
    {id:'shoulder_p',name:'ショルダープレス',role:'肩メイン',rpe:7,spec:'3×10+3/7+BO',muscles:['肩'],bo:true,f37:true},
    {id:'cable_lat',name:'ケーブルサイドレイズ',role:'肩補助',rpe:7,spec:'2×15+3/7',muscles:['肩(サイド)'],bo:false,f37:true},
    {id:'face_pull',name:'フェイスプル',role:'肩・リア',rpe:7,spec:'3×15',muscles:['肩(リア)'],bo:false,f37:false},
    Object.assign({},HLR_ITEM)
  ]},
  '金':{title:'オフ',sub:'休養日',items:[]},
  '土':{title:'胸＋三頭＋腕（メイン）',sub:'',items:[
    {id:'bench',name:'ベンチプレス',role:'メイン',rpe:8,spec:'2×5+BO1×6',muscles:['胸'],bo:true,f37:false},
    {id:'incline',name:'インクラインベンチ',role:'メイン補助',rpe:8,spec:'2×8+BO',muscles:['胸'],bo:true,f37:false},
    {id:'cable_cross',name:'ケーブルクロス',role:'補助',rpe:7,spec:'2×12+BO',muscles:['胸'],bo:true,f37:false},
    {id:'ez_lying',name:'EZライイング',role:'三頭メイン',rpe:8,spec:'3×8',muscles:['三頭'],bo:false,f37:false},

  ]},
  '日':{title:'背中＋二頭（メイン）',sub:'',items:[

  ]}
};

const IND_META={
  '重量PR':{cls:'ind-pr-w',label:'👑 PR'},
  'rep PR':{cls:'ind-pr-r',label:'🔥 rep'},
  'vol PR':{cls:'ind-pr',label:'✨ vol'},
  'PR':{cls:'ind-pr',label:'PR'},
  'repPR':{cls:'ind-pr-r',label:'🔥 rep'},
  'volPR':{cls:'ind-pr',label:'✨ vol'},
  '要注意':{cls:'ind-warn',label:'WARN'},
  '停滞':{cls:'ind-flat',label:'FLAT'},
  '順調':{cls:'ind-up',label:'UP'},
  '初回':{cls:'ind-init',label:'NEW'}
};
function isPR(ind){return ind==='重量PR'||ind==='rep PR'||ind==='vol PR'||ind==='PR'||ind==='repPR'||ind==='volPR';}
function isWeightPR(ind){return ind==='重量PR';}
function indChip(ind){
  const m=IND_META[ind]||{cls:'ind-init',label:ind?esc(ind):'—'};
  return `<span class="ind ${m.cls}">${m.label}</span>`;
}
function indDotCls(ind){
  if(isPR(ind))return 'd-pr';
  if(ind==='要注意')return 'd-warn';

function beep(freq,dur){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
    const t0=audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001,t0);

    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

}

/* ================= DURABLE STORAGE =================
   iOS（特にホーム画面に追加したWebアプリ）では localStorage が
   OS都合で消去されることがある。対策として
   1) IndexedDB に同じ内容をミラーし、消えていたら自動復元
   2) navigator.storage.persist() で消去対象から外すよう要求
   3) localStorage が空でも「初期データで黙って上書き」しない
   の3段構えにする。 */
const IDB_NAME='training_log_db', IDB_STORE='kv';
let idbPromise=null;
function idbOpen(){
  if(idbPromise)return idbPromise;
  idbPromise=new Promise(res=>{
    let req;
    try{req=indexedDB.open(IDB_NAME,1);}catch(e){return res(null);}
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>res(null);
    req.onblocked=()=>res(null);
  });
  return idbPromise;
}
function idbSet(key,val){
  return idbOpen().then(db=>{
    if(!db)return false;
    return new Promise(res=>{
      try{
        const tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(val,key);
        tx.oncomplete=()=>res(true);
        tx.onerror=()=>res(false);
        tx.onabort=()=>res(false);
      }catch(e){res(false);}
    });
  }).catch(()=>false);
}
function idbGet(key){
  return idbOpen().then(db=>{
    if(!db)return null;
    return new Promise(res=>{
      try{
        const tx=db.transaction(IDB_STORE,'readonly');
        const r=tx.objectStore(IDB_STORE).get(key);
        r.onsuccess=()=>res(r.result===undefined?null:r.result);
        r.onerror=()=>res(null);
      }catch(e){res(null);}
    });
  }).catch(()=>null);
}

let seededFromDefaults=false;

function normalizeRecords(list){
  let changed=false;
  list.forEach(r=>{if(!r.protocol){r.protocol=inferProtocol(r);changed=true;}});
  list.sort(byDate);
  return changed;
}

function loadAll(){

    records=seedToRecords();
    seededFromDefaults=true;
  }else{
    records=recs;
    const changed=normalizeRecords(records);
    if(changed)persistRecords();
  }
  if(seededFromDefaults)normalizeRecords(records);
  try{prefs=JSON.parse(localStorage.getItem(LS_PREFS))||{};}catch(e){prefs={};}

// 起動直後に IndexedDB と付き合わせ、localStorage が消えていれば復元する
async function reconcileStorage(){
  let idbRecs=null,stamp=null;
  try{
    idbRecs=await idbGet('records');
    stamp=await idbGet('stamp');
  }catch(e){}
  const haveIdb=Array.isArray(idbRecs)&&idbRecs.length>0;

  if(seededFromDefaults){
    if(haveIdb){
      // localStorage が消去されていた → ミラーから復元
      records=idbRecs;
      normalizeRecords(records);
      seededFromDefaults=false;
      try{localStorage.setItem(LS_KEY,JSON.stringify(records));}catch(e){}
      const when=stamp&&stamp.at?new Date(stamp.at).toLocaleDateString('ja-JP'):'—';
      renderToday();
      showRecoverBanner(`<span>端末のブラウザ保存領域が消えていたため、バックアップ領域から <b>${records.length}件</b>（最終保存 ${when}）を復元しました。</span><button id="rcDismiss"><b>OK</b></button>`);
    }else{
      // 本当に初回。ここで初めて初期データを確定させる
      persistRecords();
    }
    return;
  }

  if(!haveIdb){
    // 初回のミラー作成（この更新より前から使っている場合）
    persistRecords();
    return;
  }
  if(idbRecs.length>records.length){
    // localStorage 側だけが巻き戻っている
    const diff=idbRecs.length-records.length;
    showRecoverBanner(`<span>バックアップ領域に <b>${diff}件</b> 多く記録が残っています。復元しますか？</span><button id="rcRestore"><b>復元</b></button>`,true);
    window.__rcPending=idbRecs;
  }else{
    idbSet('records',records);
  }
}

function bindRecover(){

    if(!b)return;

/* ================= CALC ================= */
function inferProtocol(r){
  if(!r)return null;
  const r1=Number(r.reps1)||0;
  const r2=Number(r.reps2)||0;
  const s=Number(r.sets)||0;
  const hasBO=!!(r.bo_w&&r.bo_r);
  const has37=!!(r.f37_w&&r.f37_r);
  if(r2){
    let tag=`${r1}+${r2}`;
    if(hasBO)tag+='_BO';
    if(has37)tag+='_37';
    return tag;
  }
  if(r1>=20)return `${r1}rep`;
  let tag=`${r1}x${s||1}`;
  if(hasBO)tag+='_BO';
  if(has37)tag+='_37';
  return tag;
}
function mainVolOf(w,r1,r2,s){
  if(w==null||r1==null)return 0;
  if(r2!=null)return w*(r1+r2);
  return w*r1*(s||1);
}
function f37VolOf(r){return (r.f37_w&&r.f37_r)?r.f37_w*r.f37_r:0;}
function totalVolOf(r){return (r.vol||0)+(r.bo_v||0)+f37VolOf(r);}
function est1RM(w,r1){
  w=Number(w)||0;r1=Number(r1)||0;
  if(w<=0||r1<=0)return null;
  if(r1===1)return w;
  return Math.round(w*(1+Math.min(r1,12)/30)*10)/10;
}
function e1rmOf(r){
  if(!r)return null;
  const c=[];
  const a=est1RM(r.weight,r.reps1);if(a)c.push(a);
  const b=est1RM(r.bo_w,r.bo_r);if(b)c.push(b);
  return c.length?Math.max(...c):null;
}
function repsOf(r){return (Number(r.reps1)||0)+(Number(r.reps2)||0);}
function totalRepsOf(r){
  const r1=Number(r.reps1)||0,r2=Number(r.reps2)||0,s=Number(r.sets)||1;
  if(r2)return r1+r2;
  return r1*s;
}
function fdNorm(v){
  if(v===null||v===undefined||v==='')return null;
  return Number(v)?1:0;
}
function recSetCount(r){
  if(!r)return 0;
  let n=0;
  if(r.weight&&r.reps1){
    if(r.reps2)n+=2;
    else n+=Number(r.sets)||0;
  }else if(r.exId==='hlr'&&r.reps1){
    n+=Number(r.sets)||1;
  }
  if(r.bo_w&&r.bo_r)n+=Number(r.bo_s)||1;
  if(r.f37_w&&r.f37_r)n+=1;
  return n;
}
function recsOf(exId){return records.filter(r=>r.exId===exId).sort(byDate);}

/* ================= INDICATOR ================= */
function judgeIndicator(rec,pastAll){
  // HLR等 重量なし種目は簡易判定
  if(rec.exId==='hlr'||rec.weight==null)return pastAll.length===0?'初回':'順調';
  let pool=pastAll.filter(p=>p.protocol===rec.protocol);
  if(!pool.length)pool=pastAll;
  if(!pool.length)return '初回';
  const cw=Number(rec.weight)||0;
  const cv=Number(rec.vol)||0;
  const cr=totalRepsOf(rec);
  const maxW=Math.max(...pool.map(p=>Number(p.weight)||0));
  const maxV=Math.max(...pool.map(p=>Number(p.vol)||0));
  if(cw>maxW&&cr>0)return '重量PR';
  if(cw>0){
    const sameW=pool.filter(p=>(Number(p.weight)||0)===cw);
    if(sameW.length){
      const maxRepsAtW=Math.max(...sameW.map(totalRepsOf));
      if(cr>maxRepsAtW&&cr>0)return 'rep PR';
    }
  }
  if(cv>maxV&&cv>0)return 'vol PR';
  const recent=pool.slice(-3);
  const avgW=recent.reduce((a,p)=>a+(Number(p.weight)||0),0)/recent.length;
  const avgV=recent.reduce((a,p)=>a+(Number(p.vol)||0),0)/recent.length;
  const last=pool[pool.length-1];
  const lastW=Number(last.weight)||0;
  const lastV=Number(last.vol)||0;
  if(cw>0&&(cw<avgW*0.95||cv<avgV*0.85))return '要注意';
  if(cw===lastW&&Math.abs(cv-lastV)<1)return '停滞';
  return '順調';
}

  if(item.bo){

function renderToday(){

  }).join('');
  const ovrHTML=T.overrideDay?`<div class="ovr-banner"><span><b>CUSTOM</b>${esc(actualDay)}曜に「${esc(sess.title)}」（${esc(T.overrideDay)}）メニューを実施</span><button id="ovrReset">RESET</button></div>`:'';

function updateCalc(exId){
  const el=$(`#calc-${exId}`);
  if(!el)return;
  const item=exById(exId)||{id:exId};
  const c=T.cards[exId];
  const rec=buildRecordFromCard(exId,item);
  if(!rec){el.innerHTML=`<span style="color:var(--text-faint);">未入力</span>`;return;}
  if(isHLR(item)){
    el.innerHTML=`<span>REPS合計 <b class="c1rm">${fmtN((rec.reps1||0)*(rec.sets||1))}</b></span>${indChip(rec.indicator)}`;
    return;
  }
  let parts=`VOL ${fmtN(rec.vol)}`;
  if(rec.bo_v)parts+=` / BO ${fmtN(rec.bo_v)}`;
  const f37v=f37VolOf(rec);
  if(f37v)parts+=` / 3·7 ${fmtN(f37v)}`;
  const rm=e1rmOf(rec);
  el.innerHTML=`<span>${parts}</span><span>1RM <b class="c1rm">${rm?fmtN(rm):'—'}</b> ${indChip(rec.indicator)}</span>`;
}

function buildRecordFromCard(exId,item){
  const c=T.cards[exId];
  if(!c)return null;
  const hlr=isHLR(item);
  const w=num(c.w),r1=num(c.r1),r2=num(c.r2);
  if(hlr){
    if(r1==null)return null;
  }else if(w==null&&r1==null)return null;
  let s=num(c.s);
  if(s==null)s=1;
  const rec={date:T.date,day:dowChar(T.date),exId,
    weight:hlr?null:w,reps1:r1,reps2:hlr?null:r2,sets:s,
    vol:hlr?null:mainVolOf(w,r1,r2,s),
    bo_w:null,bo_r:null,bo_s:null,bo_v:null,
    f37_w:null,f37_r:null,f37_done:null,
    rpe:c.rpe,indicator:null,condition:c.cond,memo:c.memo||null,protocol:null};
  const bw=num(c.bw),br=num(c.br);
  if(bw!=null&&br!=null){
    rec.bo_w=bw;rec.bo_r=br;rec.bo_s=num(c.bs)!=null?num(c.bs):1;
    rec.bo_v=bw*br*rec.bo_s;
  }
  const fw=num(c.fw),fr=num(c.fr);
  if(fw!=null)rec.f37_w=fw;
  if(fr!=null)rec.f37_r=fr;
  if(c.fd!=null)rec.f37_done=c.fd;
  rec.protocol=inferProtocol(rec);
  rec.indicator=judgeIndicator(rec,records.filter(r=>r.exId===exId&&r.date<T.date));
  return rec;
}

function markDirty(){
  T.dirty=true;
  updateSaveFab();
  saveDraft();
}
function updateSaveFab(){$('#saveFab').hidden=!T.dirty;}

function propagateCond(fromEx,val){
  Object.keys(T.cards).forEach(id=>{
    if(id===fromEx)return;
    const c=T.cards[id];
    if(!c.condTouched&&!c.cond){
      c.cond=val;
      const card=$(`.ex-card[data-card="${id}"]`);
      if(card)card.querySelectorAll('.cond-pill').forEach(b=>b.classList.toggle('active',b.dataset.val===val));
    }
  });
}

function copyLast(exId){
  const last=lastRecOf(exId);
  if(!last){toast('前回記録がありません');return;}
  const c=T.cards[exId];
  const keep={cond:c.cond,condTouched:c.condTouched,memo:c.memo};
  const nc=recToCard(last);
  nc.cond=keep.cond;nc.condTouched=keep.condTouched;nc.memo=keep.memo; // 体調・メモはコピーしない
  T.cards[exId]=nc;
  refreshCard(exId);
  const btn=document.querySelector(`.ex-card[data-card="${exId}"] .copy-btn`);
  if(btn){
    btn.classList.add('copied');
    btn.querySelector('span').textContent='✓ COPIED';
    setTimeout(()=>{btn.classList.remove('copied');btn.querySelector('span').textContent='↺ COPY';},1200);
  }
  markDirty();
}
function refreshCard(exId){
  const card=document.querySelector(`.ex-card[data-card="${exId}"]`);
  const item=exById(exId);
  if(!card||!item||!T.cards[exId])return;
  const tmp=document.createElement('div');
  tmp.innerHTML=cardHTML(item);
  card.replaceWith(tmp.firstElementChild);
  updateCalc(exId);
}


function collectRecords(){
  const day=displayDay();
  const sess=getProgram()[day]||{items:[]};
  const out=[];
  sess.items.forEach(it=>{
    const rec=buildRecordFromCard(it.id,it);
    if(rec)out.push(rec);
  });
  return out;
}

function saveLog(){
  const recs=collectRecords();
  if(!recs.length){toast('保存できる入力がありません');return;}
  const ids=new Set(recs.map(r=>r.exId));
  records=records.filter(r=>!(r.date===T.date&&ids.has(r.exId)));
  records.push(...recs);
  records.sort(byDate);
  persistRecords();
  if(prefs.autoBackup){try{doExport('-auto');}catch(e){}}
  T.dirty=false;
  clearDraft();
  // 保存済みの体調はcondTouched扱いに
  recs.forEach(r=>{if(T.cards[r.exId]&&r.condition)T.cards[r.exId].condTouched=true;});
  const sy=window.scrollY;
  renderToday();
  requestAnimationFrame(()=>window.scrollTo(0,sy));
  const prCount=recs.filter(r=>isPR(r.indicator)).length;
  toast(`${recs.length}件保存しました${prCount>0?` · PR×${prCount}`:''}`);
}

function changeDate(newDate){
  if(T.dirty&&!confirm('未保存の入力があります。日付を変更すると破棄されます。よろしいですか？')){
    $('#datePick').value=T.date;
    return;
  }
  T.date=newDate;
  T.overrideDay=null;
  T.cards={};
  T.dirty=false;
  clearDraft();
  renderToday();
}

/* ---- セット編集シート ---- */
const SHEET_FIELDS={
  main:[{k:'w',label:'KG'},{k:'r1',label:'レップ¹'},{k:'r2',label:'レップ²'},{k:'s',label:'セット'},{k:'rpe',label:'RPE',rpe:true}],
  mainHlr:[{k:'r1',label:'レップ'},{k:'s',label:'セット'}],
  bo:[{k:'bw',label:'BO KG'},{k:'br',label:'BO レップ'},{k:'bs',label:'BO セット'}],
  f37:[{k:'fw',label:'3/7 KG'},{k:'fr',label:'3/7 レップ'}]
};
const FIELD_DEFS={w:{step:2.5,min:0},r1:{step:1,min:0},r2:{step:1,min:0},s:{step:1,min:0},rpe:{step:1,min:6,max:10},bw:{step:2.5,min:0},br:{step:1,min:0},bs:{step:1,min:0},fw:{step:2.5,min:0},fr:{step:1,min:0}};
const FIELD_TO_REC={w:'weight',r1:'reps1',r2:'reps2',s:'sets',bw:'bo_w',br:'bo_r',bs:'bo_s',fw:'f37_w',fr:'f37_r'};
let sheetCtx=null;
function openSetSheet(exId,row){
  const item=exById(exId);
  if(!item)return;
  if(!T.cards[exId])T.cards[exId]=emptyCard();
  sheetCtx={exId,row};
  const c=T.cards[exId];
  const fields=row==='main'?(isHLR(item)?SHEET_FIELDS.mainHlr:SHEET_FIELDS.main):SHEET_FIELDS[row];
  const title=row==='main'?esc(item.name):(row==='bo'?'バックオフセット':'3/7法');
  const rowsHTML=fields.map(f=>{
    let v=f.k==='rpe'?(c.rpe!=null?c.rpe:''):(c[f.k]!=null?c[f.k]:'');
    return `<div class="st-row">
      <button class="st-btn" data-sact="dec" data-k="${f.k}"><span>−</span></button>
      <div class="st-mid"><input type="number" step="any" inputmode="decimal" data-sk="${f.k}" value="${esc(String(v))}" placeholder="—"><label>${f.label}${f.rpe&&item.rpe?`（目標 ${item.rpe}）`:''}</label></div>
      <button class="st-btn" data-sact="inc" data-k="${f.k}"><span>＋</span></button>
    </div>${f.rpe?'<div class="st-hint" id="rpeHint"></div>':''}`;
  }).join('');
  const doneHTML=row==='f37'?`<div class="st-done-row">
      <button class="st-done-btn ${c.fd===1?'sel-yes':''}" data-sact="fd" data-v="1"><span>✓ 完遂</span></button>
      <button class="st-done-btn ${c.fd===0?'sel-no':''}" data-sact="fd" data-v="0"><span>✗ 未達</span></button>
      <button class="st-done-btn ${c.fd==null?'sel-none':''}" data-sact="fd" data-v=""><span>—</span></button>
    </div>`:'';
  openSheet(`<h3>${title}</h3>
    ${row==='main'&&item.spec?`<div class="sheet-sub">${esc(item.spec)}</div>`:''}
    ${rowsHTML}${doneHTML}
    <div class="sheet-foot">
      <button data-sact="copy"><span>前回をコピー</span></button>
      <button data-sact="clear"><span>リセット</span></button>
    </div>
    <button class="sheet-primary" data-sact="ok"><span>完了</span></button>`,
    ()=>{sheetCtx=null;});
  updateRpeHint();
}
function updateRpeHint(){
  const el=document.getElementById('rpeHint');
  if(!el||!sheetCtx)return;
  const rpe=num(T.cards[sheetCtx.exId].rpe);
  el.textContent=rpe!=null?(rpe>=10?'限界ギリギリ':`あと${10-rpe}レップはできる`):'';
}
function sheetStep(k,dir){
  if(!sheetCtx)return;
  const exId=sheetCtx.exId;
  const c=T.cards[exId];
  const item=exById(exId);
  const def=FIELD_DEFS[k]||{step:1,min:0};
  let base=k==='rpe'?(c.rpe!=null?c.rpe:null):num(c[k]);
  if(base==null){
    // 空なら前回値ベース
    const last=lastRecOf(exId);
    if(k==='rpe')base=(last&&last.rpe!=null)?last.rpe:((item&&item.rpe)||8);
    else base=(last&&last[FIELD_TO_REC[k]]!=null)?Number(last[FIELD_TO_REC[k]]):0;
  }
  let v=base+dir*def.step;
  if(def.min!=null)v=Math.max(def.min,v);
  if(def.max!=null)v=Math.min(def.max,v);
  v=Math.round(v*100)/100;
  if(k==='rpe')c.rpe=v;else c[k]=String(v);
  const inp=document.querySelector(`#sheetRoot input[data-sk="${k}"]`);
  if(inp)inp.value=String(v);
  vibrate(20);
  markDirty();
  refreshCard(exId);
  if(k==='rpe')updateRpeHint();
}
function clearSheetRow(){
  if(!sheetCtx)return;
  const {exId,row}=sheetCtx;
  const c=T.cards[exId];
  if(row==='main'){c.w='';c.r1='';c.r2='';c.s='';c.rpe=null;}
  else if(row==='bo'){c.bw='';c.br='';c.bs='';}
  else{c.fw='';c.fr='';c.fd=null;}
  markDirty();
  refreshCard(exId);
  openSetSheet(exId,row);
}

    </div>

function updateRM(){
  const rm=est1RM(RM.w,RM.r);
  const big=document.getElementById('rmBig');
  if(big)big.textContent=rm?`${fmtN(roundToStep(rm))} kg`:'—';
  const grid=document.getElementById('rmGrid');
  if(grid)grid.innerHTML=rm?[95,90,85,80,75,70,65,60].map(p=>`<div class="rm-cell"><div class="rp">${p}%</div><div class="rw">${fmtN(roundToStep(rm*p/100))}</div></div>`).join(''):'';
}

/* ---- シート内イベント ---- */
function bindSheet(){
  const sr=$('#sheetRoot');
  sr.addEventListener('click',e=>{
    if(e.target.classList.contains('sheet-back')){closeSheet();return;}
    const b=e.target.closest('button');
    if(!b)return;
    const tact=b.dataset.tact;
    if(tact==='x'){stopTimer();return;}
    if(tact){
      Timer.end+=(+tact)*1000;
      if(Timer.end<Date.now())Timer.end=Date.now();
      timerTick();
      return;
    }
    if(b.dataset.rmstep){RM.step=parseFloat(b.dataset.rmstep);open1RMCalc();return;}
    const rmact=b.dataset.rmact;
    if(rmact){
      const k=b.dataset.k;
      const d=rmact==='inc'?1:-1;
      if(k==='w')RM.w=Math.max(0,Math.round((RM.w+d*RM.step)*100)/100);
      else RM.r=Math.max(1,Math.min(30,(RM.r||0)+d));
      const inp=sr.querySelector(`input[data-rmk="${k}"]`);
      if(inp)inp.value=k==='w'?RM.w:RM.r;
      vibrate(20);
      updateRM();
      return;
    }
    const act=b.dataset.sact;
    if(!act)return;
    if(act==='dec'||act==='inc')sheetStep(b.dataset.k,act==='inc'?1:-1);
    else if(act==='fd'&&sheetCtx){
      const c=T.cards[sheetCtx.exId];
      c.fd=b.dataset.v===''?null:Number(b.dataset.v);
      sr.querySelectorAll('.st-done-btn').forEach(x=>{
        let cls='st-done-btn';
        if(x.dataset.v===''&&c.fd==null)cls+=' sel-none';
        else if(x.dataset.v==='1'&&c.fd===1)cls+=' sel-yes';
        else if(x.dataset.v==='0'&&c.fd===0)cls+=' sel-no';
        x.className=cls;
      });
      markDirty();
      refreshCard(sheetCtx.exId);
    }
    else if(act==='copy'&&sheetCtx){
      const ctx={exId:sheetCtx.exId,row:sheetCtx.row};
      copyLast(ctx.exId);
      openSetSheet(ctx.exId,ctx.row);
    }
    else if(act==='clear'&&sheetCtx)clearSheetRow();
    else if(act==='ok')closeSheet();
  });
  sr.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.rmk){
      if(t.dataset.rmk==='w')RM.w=num(t.value)||0;
      else RM.r=num(t.value)||0;
      updateRM();
      return;
    }
    const sk=t.dataset.sk;
    if(!sk||!sheetCtx)return;
    const c=T.cards[sheetCtx.exId];
    if(sk==='rpe')c.rpe=num(t.value);
    else c[sk]=t.value;
    markDirty();
    refreshCard(sheetCtx.exId);
    if(sk==='rpe')updateRpeHint();
  });
  $('#timerChip').addEventListener('click',()=>{if(Timer.running)openTimerSheet();});
}

/* ================= REST TIMER (リング表示) ================= */
const Timer={end:0,total:0,rounds:0,round:0,label:'',int:null,lastBeep:-1,doneTm:null,running:false};
const RING_C=2*Math.PI*88;
function timerSheetHTML(){
  return `<h3>休憩カウントダウン</h3>
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="88"/>
        <circle class="ring-arc" id="ringArc" cx="100" cy="100" r="88" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center"><div class="ring-time" id="ringTime">0:00</div><div class="ring-round" id="ringRound"></div></div>
    </div>
    <div class="timer-ctl">
      <button data-tact="-15"><span>−15</span></button>
      <button data-tact="15"><span>＋15</span></button>
      <button class="skip" data-tact="x"><span>スキップ</span></button>
    </div>`;
}
function openTimerSheet(){
  openSheet(timerSheetHTML(),()=>{updateTimerChip();});
  timerTick();
  updateTimerChip();
}
function startTimer(sec,label,rounds){
  clearTimeout(Timer.doneTm);
  if(Timer.int)clearInterval(Timer.int);
  Timer.end=Date.now()+sec*1000;
  Timer.total=sec;
  Timer.rounds=rounds||1;
  Timer.round=1;
  Timer.label=label||'';
  Timer.lastBeep=-1;
  Timer.running=true;
  Timer.int=setInterval(timerTick,250);
  openTimerSheet();
}
function timerTick(){
  if(!Timer.running)return;
  const rem=Math.max(0,Math.ceil((Timer.end-Date.now())/1000));
  const txt=`${Math.floor(rem/60)}:${pad2(rem%60)}`;
  const tt=document.getElementById('ringTime');
  if(tt)tt.textContent=txt;
  const arc=document.getElementById('ringArc');
  if(arc){
    const frac=Timer.total>0?rem/Timer.total:0;
    arc.style.strokeDashoffset=String(RING_C*(1-Math.min(1,Math.max(0,frac))));
  }
  const rr=document.getElementById('ringRound');
  if(rr)rr.textContent=(Timer.rounds>1?`ROUND ${Timer.round}/${Timer.rounds} · `:'')+(Timer.label||'REST');
  const wrap=document.getElementById('ringWrap');
  if(wrap)wrap.classList.toggle('warn',rem<=10&&rem>0);
  updateTimerChip(txt);
  if(rem<=10&&rem>0&&Timer.lastBeep!==rem){Timer.lastBeep=rem;beep(880,0.08);}
  if(rem<=0)timerFinish();
}
function updateTimerChip(txt){
  const chip=document.getElementById('timerChip');
  if(!chip)return;
  const sheetOpen=!!document.getElementById('ringTime');
  if(Timer.running&&!sheetOpen){
    if(txt==null){
      const rem=Math.max(0,Math.ceil((Timer.end-Date.now())/1000));
      txt=`${Math.floor(rem/60)}:${pad2(rem%60)}`;
    }
    chip.querySelector('span').textContent=txt;
    chip.hidden=false;
  }else{
    chip.hidden=true;
  }
}
function timerFinish(){
  clearInterval(Timer.int);Timer.int=null;
  vibrate([200,100,200,100,400]);
  beep(660,0.18);
  setTimeout(()=>beep(880,0.3),200);
  if(Timer.round<Timer.rounds){
    Timer.round++;
    toast(`ROUND ${Timer.round}/${Timer.rounds} スタート`);
    Timer.end=Date.now()+Timer.total*1000;
    Timer.lastBeep=-1;
    Timer.int=setInterval(timerTick,250);
    return;
  }
  toast('休憩終了！次のセットへ');
  Timer.running=false;
  updateTimerChip();
  Timer.doneTm=setTimeout(stopTimer,4000);
}
function stopTimer(){
  clearInterval(Timer.int);Timer.int=null;
  clearTimeout(Timer.doneTm);
  Timer.running=false;
  Timer.round=0;
  updateTimerChip();
  if(document.getElementById('ringTime'))closeSheet();
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&Timer.running)timerTick();
});

/* ---- 期間フィルタ（STATS） ---- */
function periodCutoff(p){
  if(p==='all')return null;
  if(p==='week')return weekStartStr(todayStr());
  if(p==='month')return addDaysStr(todayStr(),-30);
  return addDaysStr(todayStr(),-365);
}

/* ================= TODAY EVENTS ================= */
function bindToday(){
  const v=$('#view-today');
  v.addEventListener('input',e=>{
    const t=e.target;
    const ex=t.dataset.ex,f=t.dataset.f;
    if(!ex||!f)return;
    if(!T.cards[ex])T.cards[ex]=emptyCard();
    T.cards[ex][f]=t.value;
    updateCalc(ex);
    markDirty();
  });
  v.addEventListener('change',e=>{
    if(e.target.id==='datePick')changeDate(e.target.value);
  });
  v.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b)return;
    if(b.id==='bkSaveNow'){doExport();return;}
    if(b.id==='ovrReset'){T.overrideDay=null;renderToday();return;}
    const act=b.dataset.act;
    if(!act)return;
    const ex=b.dataset.ex;
    if(act==='dayTab'){
      const d=b.dataset.day;
      T.overrideDay=(d===dowChar(T.date))?null:d;
      renderToday();
    }else if(act==='wgToggle'){
      wgExpanded=(wgExpanded===b.dataset.g)?null:b.dataset.g;
      const sy=window.scrollY;
      renderToday();
      window.scrollTo(0,sy);
    }else if(act==='row'){
      openSetSheet(ex,b.dataset.row);
    }else if(act==='cond'){
      const c=T.cards[ex];
      c.cond=(c.cond===b.dataset.val)?null:b.dataset.val;
      c.condTouched=true;
      b.parentElement.querySelectorAll('.cond-pill').forEach(p=>p.classList.toggle('active',p.dataset.val===c.cond));
      if(c.cond)propagateCond(ex,c.cond);
      markDirty();
    }else if(act==='copy'){
      copyLast(ex);
    }else if(act==='timer'){
      const sec=+b.dataset.sec;
      const rounds=b.dataset.rounds?+b.dataset.rounds:1;
      startTimer(sec,rounds>1?'3/7 REST':'休憩',rounds);
    }
  });
  $('#saveFab').addEventListener('click',saveLog);
}
window.addEventListener('beforeunload',e=>{
  if(T.dirty){e.preventDefault();e.returnValue='';}
});
</script>
<script>
'use strict';
/* ================= CHART HELPER ================= */
function makeChart(id,cfg){
  if(!window.Chart)return;
  if(charts[id]){charts[id].destroy();delete charts[id];}
  const el=document.getElementById(id);
  if(!el)return;
  charts[id]=new Chart(el,cfg);
}

/* ================= HISTORY ================= */
function metricVal(r,m){
  if(m==='weight')return Number(r.weight)||null;
  if(m==='e1rm')return e1rmOf(r);
  if(m==='vol')return Number(r.vol)||null;
  return repsOf(r)||null;
}
const METRIC_COLORS={weight:'#d94a3d',e1rm:'#ffd966',vol:'#c9a961',reps:'#7a9e5c'};
function renderHistory(){
  const progList=programExList();
  const progIds=new Set(progList.map(i=>i.id));
  const oldIds=[...new Set(records.map(r=>r.exId))].filter(id=>!progIds.has(id));
  if(!H.exId){
    const hasBench=progIds.has('bench')||oldIds.includes('bench');
    if(hasBench)H.exId='bench';
    else{
      const firstWith=progList.find(it=>recsOf(it.id).length);
      H.exId=(firstWith||progList[0]||{id:oldIds[0]||null}).id;
    }
  }
  const opts=progList.map(it=>`<option value="${esc(it.id)}" ${it.id===H.exId?'selected':''}>${esc(it.name)}</option>`).join('')
    +oldIds.map(id=>`<option value="${esc(id)}" ${id===H.exId?'selected':''}>${esc(exName(id))}（旧）</option>`).join('');
  const all=recsOf(H.exId);
  const protoCounts={};
  all.forEach(r=>{protoCounts[r.protocol]=(protoCounts[r.protocol]||0)+1;});
  const protos=Object.keys(protoCounts).sort((a,b)=>protoCounts[b]-protoCounts[a]);
  if(H.protocol!=='all'&&!protoCounts[H.protocol])H.protocol='all';
  const pool=(H.protocol==='all'?all:all.filter(r=>r.protocol===H.protocol));
  const pillsHTML=protos.length>1?`<div class="pill-scroll">
      <button class="proto-pill ${H.protocol==='all'?'active':''}" data-proto="all"><span>ALL ${all.length}</span></button>
      ${protos.map(p=>`<button class="proto-pill ${H.protocol===p?'active':''}" data-proto="${esc(p)}"><span>${esc(p)} ${protoCounts[p]}</span></button>`).join('')}
    </div>`:'';
  const METRICS=[['weight','WEIGHT'],['e1rm','1RM'],['vol','VOL'],['reps','REPS']];
  const metricHTML=`<div class="metric-toggle">${METRICS.map(([k,l])=>`<button class="metric-btn ${H.metric===k?'active':''}" data-metric="${k}"><span>${l}</span></button>`).join('')}</div>`;
  const maxW=pool.some(r=>r.weight!=null)?Math.max(...pool.map(r=>r.weight||0)):null;
  const rms=pool.map(e1rmOf).filter(v=>v!=null);
  const max1rm=rms.length?Math.max(...rms):null;
  const prCount=pool.filter(r=>isPR(r.indicator)).length;
  const statsHTML=`<div class="stat-grid">
    <div class="stat-tile"><div class="sv">${fmtN(maxW)}<small>kg</small></div><div class="sl">MAX WEIGHT</div></div>
    <div class="stat-tile"><div class="sv gold">${max1rm?fmtN(max1rm):'—'}<small>kg</small></div><div class="sl">EST 1RM</div></div>
    <div class="stat-tile"><div class="sv">${prCount}<small>回</small></div><div class="sl">PRs · ${pool.length}回中</div></div>
  </div>`;
  const entries=pool.slice().reverse().map(r=>`<div class="log-entry">
    <span class="le-date">${r.date.slice(2).replace(/-/g,'/')}</span>
    <div class="le-main">
      <div class="le-vals"><span class="proto-tag">${esc(r.protocol)}</span><span>${esc(lastSummary(r,{id:r.exId}))}</span>${indChip(r.indicator)}</div>
      <div class="le-memo">VOL ${r.vol!=null?fmtN(r.vol):'—'}${(r.memo||r.condition)?` · ${r.condition?esc(r.condition)+(r.memo?' · ':''):''}${esc(r.memo||'')}`:''}</div>
    </div>
  </div>`).join('');
  $('#view-history').innerHTML=`
    <select class="hsel" id="histEx">${opts}</select>
    ${pillsHTML}
    ${metricHTML}
    ${statsHTML}
    <div class="chart-box"><canvas id="histChart"></canvas></div>
    <div class="panel"><div class="panel-title">LOG ENTRIES<small>${pool.length}件</small></div>
      ${entries||'<div class="empty-msg">記録がありません</div>'}
    </div>`;
  if(pool.length){
    const color=METRIC_COLORS[H.metric]||'#d94a3d';
    const ptColor=pool.map(r=>isWeightPR(r.indicator)?'#ffd966':(isPR(r.indicator)?'#c9a961':color));
    makeChart('histChart',{type:'line',
      data:{labels:pool.map(r=>shortDate(r.date)),datasets:[{
        data:pool.map(r=>metricVal(r,H.metric)),
        borderColor:color,backgroundColor:color+'18',fill:true,tension:0.3,spanGaps:true,borderWidth:2,
        pointRadius:pool.map(r=>isWeightPR(r.indicator)?5:(isPR(r.indicator)?4:3)),
        pointHoverRadius:5,
        pointBackgroundColor:ptColor,
        pointBorderColor:ptColor
      }]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{maxTicksLimit:8}},y:{grace:'8%'}}}});
  }
}
function bindHistory(){
  const v=$('#view-history');
  v.addEventListener('change',e=>{
    if(e.target.id==='histEx'){H.exId=e.target.value;H.protocol='all';renderHistory();}
  });
  v.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b)return;
    if(b.dataset.proto){H.protocol=b.dataset.proto;renderHistory();}
    else if(b.dataset.metric){H.metric=b.dataset.metric;renderHistory();}
  });
}

/* ================= STATS ================= */
function weekStreak(){
  if(!records.length)return 0;
  const weeks=new Set(records.map(r=>weekStartStr(r.date)));
  let n=0;
  let w=weekStartStr(todayStr());
  while(weeks.has(w)){n++;w=addDaysStr(w,-7);}
  return n;
}
function stagnationList(){
  const exIds=[...new Set(records.map(r=>r.exId))];
  const today=todayStr();
  const out=[];
  exIds.forEach(id=>{
    const rs=recsOf(id);
    if(rs.length<2)return;
    let lastPRIdx=-1;
    for(let i=rs.length-1;i>=0;i--){if(isPR(rs[i].indicator)){lastPRIdx=i;break;}}
    const lastPR=lastPRIdx>=0?rs[lastPRIdx]:null;
    const sincePR=lastPRIdx>=0?(rs.length-1-lastPRIdx):rs.length;
    const lastPRDate=lastPR?lastPR.date:rs[0].date;
    const days=Math.floor((parseDate(today)-parseDate(lastPRDate))/86400000);
    const daysSinceLast=Math.floor((parseDate(today)-parseDate(rs[rs.length-1].date))/86400000);
    const last5=rs.slice(-5);
    const fwRate=last5.filter(r=>r.indicator==='停滞'||r.indicator==='要注意').length/last5.length;
    let score=0;
    if(sincePR>=3)score+=Math.min(40,sincePR*8);
    if(days>=21)score+=Math.min(30,(days-21)*0.5+10);
    score+=fwRate*30;
    score=Math.round(score);
    const level=score>=60?'重度':score>=35?'中度':score>=15?'軽度':'順調';
    out.push({id,score,level,sincePR,days,daysSinceLast,fwRate,last5,lastPR,lastPRDate});
  });
  out.sort((a,b)=>b.score-a.score);
  return out;
}
function stagAction(st){
  if(st.level==='順調')return '';
  if(st.fwRate>=0.6)return '⚠ 直近で5回中3回以上の停滞/要注意 — 種目・グリップ・角度の変更を検討';
  if(st.sincePR>=5)return 'rep数を下げて重量を上げる、または3/7法を追加';
  if(st.sincePR>=3)return '次回 +2.5kg にトライ（RPE7-8で2回連続達成済みなら）';
  if(st.daysSinceLast>14)return `${st.daysSinceLast}日間未実施 — 再開時は前回比 −10% から`;
  return '経過観察';
}
function renderStats(){
  const dates=[...new Set(records.map(r=>r.date))];
  const prsAll=records.filter(r=>isPR(r.indicator));
  const exCount=new Set(records.map(r=>r.exId)).size;
  const weeksSpan=records.length?Math.max(1,Math.round((parseDate(records[records.length-1].date)-parseDate(records[0].date))/604800000)+1):0;
  const withRecs=[];
  programExList().forEach(it=>{if(recsOf(it.id).length)withRecs.push(it.id);});
  [...new Set(records.map(r=>r.exId))].forEach(id=>{if(!withRecs.includes(id))withRecs.push(id);});
  if(!Sv.progEx||!withRecs.includes(Sv.progEx))Sv.progEx=withRecs[0]||null;
  const progOpts=withRecs.map(id=>`<option value="${esc(id)}" ${id===Sv.progEx?'selected':''}>${esc(exName(id))}</option>`).join('');
  // --- TRAINING MIX（期間フィルタ付き横棒グラフ） ---
  const period=Sv.period||'week';
  const cutoff=periodCutoff(period);
  const prec=cutoff?records.filter(r=>r.date>=cutoff):records;
  const periodHTML=`<div class="period-toggle">${[['week','週'],['month','月'],['year','年'],['all','すべて']].map(([k,l])=>`<button class="period-btn ${period===k?'active':''}" data-period="${k}"><span>${l}</span></button>`).join('')}</div>`;
  const exCounts={};
  prec.forEach(r=>{exCounts[r.exId]=(exCounts[r.exId]||0)+1;});
  const topEx=Object.entries(exCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxC=topEx.length?topEx[0][1]:1;
  const freqHTML=topEx.map(([id,n])=>{
    const g=exGroup(id);
    const col=g?GROUP_COLORS[g]:'#5b6a82';
    return `<div class="hbar-row"><div class="hbar-label"><b>${esc(exName(id))}</b><span>${n}回</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(n/maxC*100)}%;background:${col}"></div></div></div>`;
  }).join('')||'<div class="empty-msg">この期間の記録がありません</div>';
  const grpSets={};
  GROUPS.forEach(g=>grpSets[g]=0);
  prec.forEach(r=>{const g=exGroup(r.exId);if(g)grpSets[g]+=recSetCount(r);});
  const maxG=Math.max(1,...GROUPS.map(g=>grpSets[g]));
  const totalG=GROUPS.reduce((a,g)=>a+grpSets[g],0)||1;
  const grpHTML=GROUPS.slice().sort((a,b)=>grpSets[b]-grpSets[a]).map(g=>{
    const n=grpSets[g];
    return `<div class="grp-row"><span class="grp-dot" style="background:${GROUP_COLORS[g]}"></span><span class="grp-name">${g}</span><div class="grp-bar"><i style="width:${Math.round(n/maxG*100)}%;background:${GROUP_COLORS[g]}"></i></div><span class="grp-val"><b>${n}セット</b>${Math.round(n/totalG*100)}%</span></div>`;
  }).join('');
  // --- RECENT PRs ---
  const recentPRs=prsAll.slice().reverse().slice(0,8);
  const prHTML=recentPRs.map(r=>`<button class="pr-item" data-ex="${esc(r.exId)}">
      <span class="pd">${shortDate(r.date)}</span><span class="pn">${esc(exName(r.exId))}</span>
      <span class="pv">${r.weight!=null?fmtN(r.weight)+'kg':'—'} · ${r.reps1!=null?fmtN(r.reps1):'—'}rep</span>${indChip(r.indicator)}
    </button>`).join('')||'<div class="empty-msg">PRがまだありません</div>';
  // --- STAGNATION ---
  let stags=stagnationList();
  if(!Sv.stagAll)stags=stags.filter(s=>s.level!=='順調');
  const lvCls={'重度':'lv-bad','中度':'lv-mid','軽度':'lv-lite','順調':'lv-ok'};
  const stagHTML=stags.slice(0,12).map(st=>{
    const act=stagAction(st);
    const prTxt=st.lastPR?`PR ${st.lastPR.weight!=null?fmtN(st.lastPR.weight)+'kg':'—'} · ${shortDate(st.lastPRDate)}`:'PR未達成';
    return `<button class="stag-card" data-ex="${esc(st.id)}">
      <div class="stag-head"><span class="stag-name">${esc(exName(st.id))}${exById(st.id)?'':'（旧）'}</span><span class="stag-lv ${lvCls[st.level]}">${st.level} ${st.score}</span></div>
      <div class="stag-meta"><span>${prTxt} · ${st.sincePR}回経過 · ${st.days}日</span><span class="stag-dots">${st.last5.map(r=>`<i class="sdot ${indDotCls(r.indicator)}" title="${r.date}"></i>`).join('')}</span></div>
      ${act?`<div class="stag-act">${esc(act)}</div>`:''}
    </button>`;
  }).join('')||`<div class="empty-msg">${Sv.stagAll?'対象種目がありません':'警告対象なし · 全種目順調 ✓'}</div>`;
  $('#view-stats').innerHTML=`
    <div class="panel"><div class="panel-title">OVERVIEW</div>
      <div class="ov-grid">
        <div class="stat-tile"><div class="sv">${dates.length}</div><div class="sl">SESSIONS</div></div>
        <div class="stat-tile"><div class="sv">${weeksSpan}<small>週</small></div><div class="sl">PERIOD</div></div>
        <div class="stat-tile"><div class="sv gold">${prsAll.length}</div><div class="sl">PRs</div></div>
        <div class="stat-tile"><div class="sv">${exCount}</div><div class="sl">EXERCISES</div></div>
        <div class="stat-tile"><div class="sv">${weekStreak()}<small>週</small></div><div class="sl">STREAK</div></div>
      </div>
    </div>
    <div class="panel"><div class="panel-title">TRAINING MIX<small>種目・部位の分布</small></div>
      ${periodHTML}
      <div style="font-size:12px;font-weight:700;margin-bottom:10px;">よく行う種目</div>
      ${freqHTML}
      <hr class="sep" style="margin:14px 0;">
      <div style="font-size:12px;font-weight:700;">部位別トレーニング</div>
      ${grpHTML}
    </div>
    <div class="panel"><div class="panel-title">PROGRESSION</div>
      <select class="hsel" id="progEx">${progOpts}</select>
      <div style="height:200px;position:relative;"><canvas id="progChart"></canvas></div>
    </div>
    <div class="panel"><div class="panel-title">RECENT PRs</div>${prHTML}</div>
    <div class="panel"><div class="panel-title">STAGNATION ALERT</div>
      <div class="stag-toggle">
        <button class="metric-btn ${Sv.stagAll?'active':''}" data-stag="all"><span>ALL</span></button>
        <button class="metric-btn ${!Sv.stagAll?'active':''}" data-stag="warn"><span>警告のみ</span></button>
      </div>
      ${stagHTML}
    </div>
    <div class="panel"><div class="panel-title">WEEKLY VOLUME<small>過去8週 · 部位別</small></div>
      <div style="height:200px;position:relative;"><canvas id="wvChart"></canvas></div>
    </div>`;
  // progression chart
  if(Sv.progEx){
    const rs=recsOf(Sv.progEx);
    makeChart('progChart',{type:'line',
      data:{labels:rs.map(r=>shortDate(r.date)),datasets:[
        {label:'実重量',data:rs.map(r=>r.weight),borderColor:'#d94a3d',backgroundColor:'transparent',tension:0.3,borderWidth:2,spanGaps:true,order:1,
          pointRadius:rs.map(r=>isWeightPR(r.indicator)?6:3),
          pointBackgroundColor:rs.map(r=>isWeightPR(r.indicator)?'#ffd966':'#d94a3d'),
          pointBorderColor:rs.map(r=>isWeightPR(r.indicator)?'#ffd966':'#d94a3d')},
        {label:'推定1RM',data:rs.map(e1rmOf),borderColor:'#ffd966',backgroundColor:'#ffd96618',fill:true,tension:0.3,borderWidth:2,spanGaps:true,order:2,
          pointRadius:rs.map(r=>isWeightPR(r.indicator)?5:2),
          pointBackgroundColor:rs.map(r=>isWeightPR(r.indicator)?'#ffd966':'#c9a96188'),
          pointBorderColor:rs.map(r=>isWeightPR(r.indicator)?'#ffd966':'#c9a96188')}
      ]},
      options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10}}},scales:{x:{ticks:{maxTicksLimit:7}},y:{grace:'8%'}}}});
  }
  // weekly volume chart
  const weeks=[];
  let w=weekStartStr(todayStr());
  for(let i=0;i<8;i++){weeks.unshift(w);w=addDaysStr(w,-7);}
  const dsets=GROUPS.map(g=>({label:g,
    data:weeks.map(ws=>{
      const we=addDaysStr(ws,6);
      return Math.round(records.filter(r=>r.date>=ws&&r.date<=we&&exGroup(r.exId)===g).reduce((a,r)=>a+(Number(r.vol)||0),0));
    }),

// 全記録を seed_data.js 互換形式の文字列に変換
function buildSeedJS(){
  const q=s=>"'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
  const lines=records.map(r=>{
    const d=[];
    if(r.weight!=null)d.push('w:'+r.weight);
    if(r.reps1!=null)d.push('r1:'+r.reps1);
    if(r.reps2!=null)d.push('r2:'+r.reps2);
    if(r.sets!=null)d.push('s:'+r.sets);
    if(r.vol!=null)d.push('v:'+r.vol);
    if(r.bo_w!=null)d.push('bw:'+r.bo_w);
    if(r.bo_r!=null)d.push('br:'+r.bo_r);
    if(r.bo_s!=null)d.push('bs:'+r.bo_s);
    if(r.bo_v!=null)d.push('bv:'+r.bo_v);
    if(r.f37_w!=null)d.push('fw:'+r.f37_w);
    if(r.f37_r!=null)d.push('fr:'+r.f37_r);
    if(r.f37_done!=null)d.push('fd:'+(Number(r.f37_done)?1:0));
    if(r.rpe!=null)d.push('rpe:'+r.rpe);
    if(r.indicator)d.push('ind:'+q(r.indicator));
    if(r.condition)d.push('cond:'+q(r.condition));
    if(r.memo)d.push('mem:'+q(r.memo));
    return `  [${q(r.date)},${q(r.day)},${q(r.exId)},{${d.join(',')}}],`;
  });
  return `// TRAINING.LOG 全記録エクスポート（${todayStr()} / ${records.length}件）\n// このファイルを seed_data.js として置き換えれば、初期データとしてそのまま使えます\nconst SEED = [\n${lines.join('\n')}\n];\n`;
}
function exportSeedJS(){
  if(!records.length){toast('記録がありません');return;}
  const blob=new Blob([buildSeedJS()],{type:'text/javascript'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`seed_data_${todayStr()}.js`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast(`${records.length}件をseed形式で保存しました`);
}
function applyImport(data){
  let recs=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);
  if(!recs)throw new Error('recordsが見つかりません');
  const bad=recs.find(r=>!r||!r.date||!r.exId);
  if(bad)throw new Error('不正なレコードが含まれています');
  if(!confirm(`${recs.length}件のレコードで現在のデータを置き換えます。よろしいですか？`))return false;
  records=recs;
  records.forEach(r=>{if(!r.protocol)r.protocol=inferProtocol(r);});
  records.sort(byDate);
  persistRecords();
  T.cards={};T.dirty=false;clearDraft();
  return true;
}
function reseedData(){
  if(!confirm('既存データを破棄して初期データを再投入しますか？\n先に念のためバックアップを取ります。'))return;
  doExport('-before-reseed');
  records=seedToRecords();persistRecords();
  T.cards={};T.dirty=false;clearDraft();
  toast('再投入完了（バックアップ保存済み）');
  renderSettings();
}
function wipeAll(){
  if(records.length>0){
    if(!confirm(`全${records.length}件のデータを削除します。\n先にバックアップを自動ダウンロードします。続行しますか？`))return;
    doExport('-before-delete');
    if(!confirm('バックアップを保存しました。\n本当に全データを削除しますか？\nこの操作は取り消せません。'))return;
  }else{
    if(!confirm('全データを削除しますか？'))return;
  }
  records=[];persistRecords();
  T.cards={};T.dirty=false;clearDraft();
  toast('削除完了');
  renderSettings();
}

    Chart.defaults.font.size=10;
  }
  bindToday();bindHistory();bindStats();bindSettings();bindModal();bindSheet();bindRecover();
  $$('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  renderToday();
  requestPersistentStorage();
  reconcileStorage();
}
init();
</script>
</body>
</html>
